{% extends "base.html" %}
{% block title %}{{ code }} — PDFly{% endblock %}
{% block content %}
<section class="tool-page wrap">
  <div class="panel" style="text-align:center;padding:70px 30px">
    <h1 style="font-size:64px;margin:0;color:var(--red)">{{ code }}</h1>
    <p style="color:var(--ink-soft);font-size:18px">{{ message }}</p>
    <a class="btn btn-primary" href="/">← Back to all tools</a>
  </div>
</section>
{% endblock %}
