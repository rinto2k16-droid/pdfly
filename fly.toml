# fly.toml app configuration file generated for pdfly on 2026-09-06T17:54:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "pdfly"
primary_region = 'ams'

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8080
min_machines_running = 0
processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256

[deploy]
  release_command = 'app.py'
  release_command_timeout = '5m'
  strategy = 'bluegreen'
  wait_timeout = '5m'
